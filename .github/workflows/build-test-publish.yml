name: build-test-publish
run-name: ${{ github.actor }} is building, testing and publishing 🚀

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build-and-test:
    name: 🏗️ build & test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo build
        run: cargo build --release
      - name: cargo test
        run: cargo test --release
      - name: Add aarch64-apple-darwin target (for dep-tree cross-check)
        run: rustup target add aarch64-apple-darwin
      - name: Verify http-client feature gate (default on, and off has no Apple-framework deps)
        run: ./tests/test_http_client_feature.sh aarch64-apple-darwin

  publish-cratesio:
    name: 📦 Publish to crates.io
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: publish to crates.io
        run: cargo publish --no-verify --token ${{ secrets.CRATEIO_TOKEN }}
