name: build-test-publish
run-name: ${{ github.actor }} is building, testing and publishing 🚀

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build-and-test:
    name: 🏗️ build & test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo build
        run: cargo build --release
      - name: cargo test
        run: cargo test --release
      - name: cargo test (without http-client)
        run: cargo test --no-default-features
      - name: Install Python (for cargo-zigbuild)
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # WARNING: cargo-zigbuild 0.23.4 breaks cdylib links on Apple targets
      # (rust-cross/cargo-zigbuild#479, fixed upstream in #480). Unpin once a
      # release newer than 0.23.4 is out.
      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild==0.23.3
      - name: Add aarch64-apple-darwin target
        run: rustup target add aarch64-apple-darwin
      # NOTE: Cross-links for macOS from Linux without a macOS SDK (see #364).
      # Fails if anything in the dependency tree links an Apple framework.
      - name: cargo zigbuild (aarch64-apple-darwin, without http-client)
        run: cargo zigbuild --no-default-features --target aarch64-apple-darwin

  publish-cratesio:
    name: 📦 Publish to crates.io
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: publish to crates.io
        run: cargo publish --no-verify --token ${{ secrets.CRATEIO_TOKEN }}
